name: Validate examples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(find examples tests -type f -name '*.sh' -print0)
      - name: Parse JSON fixture
        run: python -m json.tool examples/04-versioning-lifecycle/lifecycle.json > /dev/null
      - name: Run fixture and script contracts
        run: python -m unittest discover -s tests -v
